name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Generate cyberpunk snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-cyberpunk.svg?color_snake=%23a72cff&color_dots=%230b001a,%231e0b3a,%234b197e,%23a72cff,%23ff4fd8

      - name: Read contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QUERY='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}'

          gh api graphql \
            -f query="$QUERY" \
            -f login="${{ github.repository_owner }}" \
            > contributions.json

      - name: Customize snake
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import json
          import re
          from datetime import datetime

          SVG_PATH = Path("dist/github-snake-cyberpunk.svg")
          DATA_PATH = Path("contributions.json")

          svg = SVG_PATH.read_text(encoding="utf-8")
          data = json.loads(DATA_PATH.read_text(encoding="utf-8"))

          # ------------------------------------------------------------
          # 1. Slow snake animation
          # ------------------------------------------------------------
          svg = svg.replace("11900ms", "18000ms")

          # ------------------------------------------------------------
          # 2. Make snake look like pixel/grid blocks
          # ------------------------------------------------------------
          svg = svg.replace('rx="4.5" ry="4.5"', 'rx="1" ry="1"')
          svg = svg.replace('rx="4.1" ry="4.1"', 'rx="1" ry="1"')
          svg = svg.replace('rx="3.6" ry="3.6"', 'rx="1" ry="1"')
          svg = svg.replace('rx="3.3" ry="3.3"', 'rx="1" ry="1"')

          # ------------------------------------------------------------
          # 3. Read GitHub contribution calendar
          # ------------------------------------------------------------
          weeks = (
              data.get("data", {})
                  .get("user", {})
                  .get("contributionsCollection", {})
                  .get("contributionCalendar", {})
                  .get("weeks", [])
          )

          contribution_cells = []

          for col, week in enumerate(weeks):
              for row, day in enumerate(week.get("contributionDays", [])):
                  count = int(day.get("contributionCount", 0))

                  if count > 0:
                      date_value = day.get("date")

                      if date_value:
                          month_name = datetime.strptime(
                              date_value,
                              "%Y-%m-%d"
                          ).strftime("%B")

                          contribution_cells.append(
                              {
                                  "col": col,
                                  "row": row,
                                  "month": month_name,
                                  "date": date_value,
                              }
                          )

          # ------------------------------------------------------------
          # 4. Read snake head path
          # ------------------------------------------------------------
          match = re.search(
              r'@keyframes\s+s0\{(.*?)\}\.s\.s0',
              svg,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Snake head animation was not found.")

          keyframe_body = match.group(1)

          frame_pattern = re.compile(
              r'([0-9.,%]+)\{'
              r'transform:translate\('
              r'(-?\d+(?:\.\d+)?)px,'
              r'(-?\d+(?:\.\d+)?)px\)'
              r'\}'
          )

          frames = []

          for item in frame_pattern.finditer(keyframe_body):
              percentages = item.group(1).split(",")

              x = float(item.group(2))
              y = float(item.group(3))

              for percentage in percentages:
                  frames.append(
                      (
                          float(percentage.rstrip("%")),
                          x,
                          y
                      )
                  )

          # Remove duplicate percentage positions.
          unique_frames = {}

          for percentage, x, y in frames:
              unique_frames[percentage] = (x, y)

          frames = [
              (percentage, x, y)
              for percentage, (x, y)
              in sorted(unique_frames.items())
          ]

          # ------------------------------------------------------------
          # 5. Find when snake crosses contribution cells
          #
          # Instead of checking only exact keyframes, this checks every
          # horizontal/vertical path segment. This gives much better
          # month detection.
          # ------------------------------------------------------------
          month_events = {}

          def add_event(month_name, percentage):
              month_events.setdefault(month_name, []).append(percentage)

          for i in range(len(frames) - 1):
              p1, x1, y1 = frames[i]
              p2, x2, y2 = frames[i + 1]

              if p2 <= p1:
                  continue

              # Horizontal movement
              if abs(y1 - y2) < 0.001 and abs(x1 - x2) > 0.001:
                  row = round(y1 / 16)

                  left = min(x1, x2)
                  right = max(x1, x2)

                  for cell in contribution_cells:
                      if cell["row"] != row:
                          continue

                      target_x = cell["col"] * 16

                      if left <= target_x <= right:
                          ratio = (target_x - x1) / (x2 - x1)
                          percentage = p1 + ratio * (p2 - p1)
                          add_event(cell["month"], percentage)

              # Vertical movement
              elif abs(x1 - x2) < 0.001 and abs(y1 - y2) > 0.001:
                  col = round(x1 / 16)

                  top = min(y1, y2)
                  bottom = max(y1, y2)

                  for cell in contribution_cells:
                      if cell["col"] != col:
                          continue

                      target_y = cell["row"] * 16

                      if top <= target_y <= bottom:
                          ratio = (target_y - y1) / (y2 - y1)
                          percentage = p1 + ratio * (p2 - p1)
                          add_event(cell["month"], percentage)

          # ------------------------------------------------------------
          # 6. Pick ONE event for each month
          #
          # This prevents multiple labels from appearing at the same
          # time. The first contribution hit for each month is used.
          # ------------------------------------------------------------
          month_first_events = {}

          for month_name, events in month_events.items():
              if events:
                  month_first_events[month_name] = min(events)

          # Sort months by animation position.
          ordered_months = sorted(
              month_first_events.items(),
              key=lambda item: item[1]
          )

          # ------------------------------------------------------------
          # 7. Build snake movement animation for the label
          # ------------------------------------------------------------
          movement_parts = []

          for percentage, x, y in frames:
              movement_parts.append(
                  f"{percentage:.2f}%"
                  f"{{transform:translate({x}px,{y}px)}}"
              )

          movement_animation = (
              "@keyframes monthLabelMove{"
              + "".join(movement_parts)
              + "}"
          )

          # ------------------------------------------------------------
          # 8. Create NON-OVERLAPPING visibility windows
          #
          # Each month gets a small window around its event.
          # Neighboring windows are clipped at their midpoint.
          # ------------------------------------------------------------
          def build_visibility_animation(
              animation_name,
              event_percentage,
              previous_percentage,
              next_percentage
          ):
              window = 2.2

              start = max(0.0, event_percentage - window)
              end = min(100.0, event_percentage + window)

              if previous_percentage is not None:
                  midpoint = (
                      previous_percentage + event_percentage
                  ) / 2.0
                  start = max(start, midpoint + 0.05)

              if next_percentage is not None:
                  midpoint = (
                      event_percentage + next_percentage
                  ) / 2.0
                  end = min(end, midpoint - 0.05)

              if end <= start:
                  end = start + 0.2

              return (
                  f"@keyframes {animation_name}{{"
                  f"0%,{start:.2f}%{{opacity:0}}"
                  f"{start:.2f}%,{end:.2f}%{{opacity:1}}"
                  f"{end:.2f}%,100%{{opacity:0}}"
                  f"}}"
              )

          # ------------------------------------------------------------
          # 9. Build month labels
          # ------------------------------------------------------------
          month_labels = []
          visibility_animations = []

          for index, (month_name, event_percentage) in enumerate(
              ordered_months
          ):
              previous_percentage = (
                  ordered_months[index - 1][1]
                  if index > 0
                  else None
              )

              next_percentage = (
                  ordered_months[index + 1][1]
                  if index + 1 < len(ordered_months)
                  else None
              )

              animation_name = f"monthVisibility{index}"

              visibility_animations.append(
                  build_visibility_animation(
                      animation_name,
                      event_percentage,
                      previous_percentage,
                      next_percentage
                  )
              )

              safe_month = escape(month_name)

              month_labels.append(
                  f'''
          <g
            class="month-label"
            style="
              animation:
                monthLabelMove 18000ms linear infinite,
                {animation_name} 18000ms linear infinite;
            "
          >
            <rect
              x="-52"
              y="-31"
              width="104"
              height="20"
              rx="4"
              fill="#0b001a"
              stroke="#ff4fd8"
              stroke-width="1"
            />

            <polygon
              points="0,-11 -5,-6 5,-6"
              fill="#0b001a"
              stroke="#ff4fd8"
              stroke-width="1"
            />

            <text
              x="0"
              y="-18"
              text-anchor="middle"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
              font-weight="700"
              fill="#ffffff"
            >{safe_month}</text>
          </g>
                  '''
              )

          # ------------------------------------------------------------
          # 10. Add styles + labels
          # ------------------------------------------------------------
          overlay_style = (
              "<style>"
              ".month-label{"
              "pointer-events:none;"
              "transform-box:fill-box;"
              "transform-origin:0 0;"
              "}"
              + movement_animation
              + "".join(visibility_animations)
              + "</style>"
          )

          overlay = (
              overlay_style
              + '<g id="month-overlay">'
              + "".join(month_labels)
              + "</g>"
          )

          # Give the label room above the grid.
          svg = re.sub(
              r'viewBox="[^"]*"',
              'viewBox="-60 -52 960 214"',
              svg,
              count=1
          )

          svg = svg.replace(
              "</svg>",
              overlay + "</svg>"
          )

          SVG_PATH.write_text(
              svg,
              encoding="utf-8"
          )

          print("Cyberpunk snake customization complete.")
          print(
              "Detected month events:",
              ordered_months
          )
          PY

      - name: Publish generated SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
