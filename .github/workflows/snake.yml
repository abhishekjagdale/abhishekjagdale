name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate cyberpunk snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-cyberpunk.svg?color_snake=%2300ffe7&color_dots=%230b001a,%231e0b3a,%234b197e,%23a72cff,%23ff4fd8

      - name: Slow down snake animation
        run: |
          sed -i 's/11900ms/18000ms/g' dist/github-snake-cyberpunk.svg

      - name: Publish generated SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
